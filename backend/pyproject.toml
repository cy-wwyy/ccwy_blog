[project]
name = "ccwy-blog-backend"
version = "0.1.0"
description = "ccwy_blog backend"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.138.1,<1.0.0",
    "python-multipart>=0.0.27,<1.0.0",
    "email-validator>=2.1.0,<3.0.0",
    "tenacity>=8.2.3,<10.0.0",
    "pydantic>2.0",
    "sqlmodel>=0.0.39,<1.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "python-ulid>=3.0.0",
    "aiosqlite>=0.22.1",
    "aiofiles>=25.1.0",
    "oss2>=2.19.1",
    "pillow>=12.3.0",
    "alembic>=1.18.5",
    "pyotp>=2.10.0",
    "cryptography>=49.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3,<10.0.0",
    "mypy>=1.8.0,<3.0.0",
    "ruff>=0.2.2,<1.0.0",
    "coverage>=7.4.3,<8.0.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
strict = true
exclude = ["venv", ".venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
# Alembic 迁移脚本由 autogenerate 生成，沿用其模板风格（Union/Sequence 等），不纳入 lint
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
]

[tool.fastapi]
entrypoint = "app.main:app"
