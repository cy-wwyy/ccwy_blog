name: Deploy Frontend

# 只在 main 分支的前端变更时部署；也支持手动触发。
# 构建跑在 GitHub 的 x86_64 runner 上 —— 这是关键：开发机是 ARM64，
# 直接本地构建的产物（尤其 sharp 这类原生模块）在 x86 服务器上跑不起来。
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "deploy/deploy-remote.sh"
      - "deploy/blog-frontend.service"
      - "deploy/bootstrap-server.sh"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

# 同一时间只允许一个部署，避免并发覆盖
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  # 需要写 contents 才能把产物推到 dist 分支
  contents: write

env:
  # 与服务器保持一致，避免 Node 版本差异带来的意外
  NODE_VERSION: "22"
  APP_DIR: apps/ccwy-web

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 密钥配在 Environment 里（Settings → Environments），
    # 不声明 environment 的话 job 读不到这些值，${{ secrets.X }} 会拿到空
    environment: SSH_PRIVATE_KEY

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # NEXT_PUBLIC_* 在构建时被内联进产物，必须在这里注入
          NEXT_PUBLIC_AMAP_KEY: ${{ secrets.NEXT_PUBLIC_AMAP_KEY }}
          NEXT_PUBLIC_AMAP_SECRET: ${{ secrets.NEXT_PUBLIC_AMAP_SECRET }}
          # 生产由 nginx 直接反代 /api 到后端，这条 rewrite 实际不参与；
          # 设成内网地址是为了万一走到也能用
          BACKEND_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          # 空值同样能构建成功，但运行时会白屏（地图模块拿不到 key），所以提前拦下
          [ -n "${NEXT_PUBLIC_AMAP_KEY:-}" ] || { echo "::error::NEXT_PUBLIC_AMAP_KEY 未配置，地图页会白屏"; exit 1; }
          [ -n "${NEXT_PUBLIC_AMAP_SECRET:-}" ] || { echo "::error::NEXT_PUBLIC_AMAP_SECRET 未配置"; exit 1; }
          npm run build

      - name: Assemble standalone bundle
        working-directory: frontend
        run: |
          set -euo pipefail
          # standalone 不包含静态资源，必须手动补进产物目录
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          # 记录构建信息，便于线上排查是哪个 commit
          cat > .next/standalone/BUILD_INFO <<EOF
          commit=$(git rev-parse HEAD 2>/dev/null || echo unknown)
          ref=${{ github.ref_name }}
          run=${{ github.run_id }}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node=$(node -v)
          EOF
          du -sh .next/standalone

      - name: Package
        working-directory: frontend/.next/standalone
        run: |
          set -euo pipefail
          tar -czf "$GITHUB_WORKSPACE/ccwy-web.tar.gz" .
          ls -lh "$GITHUB_WORKSPACE/ccwy-web.tar.gz"

      - name: Check SSH secrets present
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          [ -n "$SSH_HOST" ] || { echo "::error::SSH_HOST 为空或未添加"; exit 1; }
          [ -n "$SSH_USER" ] || { echo "::error::SSH_USER 为空或未添加"; exit 1; }
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::SSH_PRIVATE_KEY 为空 —— 大概率加到了 Variables 标签下，应加到 Secrets 标签下"; exit 1; }
          echo "三个 SSH 凭据均已读取"

      - name: Validate SSH key format
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          case "$SSH_PRIVATE_KEY" in
            *"BEGIN OPENSSH PRIVATE KEY"*|*"BEGIN RSA PRIVATE KEY"*|*"BEGIN EC PRIVATE KEY"*) ;;
            *) echo "::error::SSH_PRIVATE_KEY 缺少 -----BEGIN ... PRIVATE KEY----- 行，粘贴不完整"; exit 1 ;;
          esac
          case "$SSH_PRIVATE_KEY" in
            *"END OPENSSH PRIVATE KEY"*|*"END RSA PRIVATE KEY"*|*"END EC PRIVATE KEY"*) ;;
            *) echo "::error::SSH_PRIVATE_KEY 缺少 -----END ... PRIVATE KEY----- 行，可能被截断"; exit 1 ;;
          esac
          case "$SSH_PRIVATE_KEY" in
            "-----BEGIN"*) ;;
            *) echo "::error::SSH_PRIVATE_KEY 开头有杂字符（空格/引号/换行），应以 -----BEGIN 开头"; exit 1 ;;
          esac
          echo "私钥首尾标记完整"

      - name: Write SSH key and probe host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 私钥能否被解析（能解析说明内容完整、未被破坏）
          ssh-keygen -l -f ~/.ssh/deploy_key || {
            echo "::error::写出的私钥无法解析，内容可能被破坏"; exit 1; }
          # 记录 host key，防止中间人
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "host key 已记录"

      - name: Probe SSH login
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          # 真正登录一次，验证公钥已加入服务器 authorized_keys
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'echo "ssh ok: $(hostname)"' || {
            echo "::error::SSH 登录失败 —— 私钥与服务器 authorized_keys 中的公钥不匹配，或 SSH_USER/SSH_PORT 有误"; exit 1; }

      - name: Publish artifact to dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 每篇一个孤立提交，强制覆盖 dist 分支；服务器用 git fetch 拉取，
          # 走的是「境内 -> GitHub」下载方向（实测 ~259KB/s），
          # 比 runner 直推服务器（~17KB/s）快一个数量级。
          mkdir -p /tmp/distpush && cd /tmp/distpush
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/ccwy-web.tar.gz" .
          printf 'sha=%s\nrun=%s\nbuilt_at=%s\n' \
            "${{ github.sha }}" "${{ github.run_id }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > COMMIT_INFO
          git add ccwy-web.tar.gz COMMIT_INFO
          git commit -q -m "deploy ${{ github.sha }}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:refs/heads/dist
          echo "已推送到 dist 分支"

      - name: Upload deploy script
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          # 只传几 KB 的脚本；大文件走 dist 分支
          scp -i ~/.ssh/deploy_key -P "$PORT" deploy/deploy-remote.sh \
            "$SSH_USER@$SSH_HOST:~/apps/ccwy-web/deploy-remote.sh"

      - name: Activate release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$SSH_USER@$SSH_HOST" \
            "bash ~/$APP_DIR/deploy-remote.sh '${{ github.sha }}'"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Frontend deploy"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| branch | \`${{ github.ref_name }}\` |"
            echo "| 结果 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
